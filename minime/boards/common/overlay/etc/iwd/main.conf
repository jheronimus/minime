# iwd main configuration (read-only, shipped in the rootfs).
# Minime uses iwd standalone: iwd performs 802.11 + WPA and provides its own
# DHCP (EnableNetworkConfiguration=true).  Known-network profiles live in the
# writable state directory set by the wifi service (STATE_DIRECTORY points at
# /mnt/sdcard/.minime/config/iwd), not /var/lib/iwd.

[General]
EnableNetworkConfiguration=true

[Network]
EnableIPv6=false
# NameResolvingService is deliberately unset: iwd then writes the
# DHCP-provided DNS servers to /etc/resolv.conf (a symlink to /tmp/resolv.conf,
# see post-build).  Required for device-initiated downloads such as the
# on-device update.sh (ADR 0017).

[Scan]
# iwd needs scans to discover and auto-connect to known networks.
DisablePeriodicScan=false
# Also scan when idle so a known network can reconnect if the AP comes up.
DisableRoamingScan=false
