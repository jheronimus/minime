[match]
model=Anbernic RG353VS
compatible=anbernic,rg353vs

[device]
device_id=rg353vs
device_model=Anbernic RG353VS

[screen]
screen_width=640
screen_height=480
screen_rotation=270
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_axis_lx=2
input_axis_ly=3
input_axis_rx=4
input_axis_ry=5
input_axis_min=-4096
input_axis_center=0
input_axis_max=4096
input_touch=0

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0
