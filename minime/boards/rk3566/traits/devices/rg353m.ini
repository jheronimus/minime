[match]
model=Anbernic RG353M
# RG353M is the metal-shell RG353P: it boots the RG353P DTB and U-Boot
# (rgxx3 board, ft_board_setup) patches only the `model` property, so the
# runtime compatible stays anbernic,rg353p.
compatible=anbernic,rg353p

[device]
device_id=rg353m
device_model=Anbernic RG353M

[screen]
screen_width=640
screen_height=480
screen_rotation=270
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_stick_device_name=adc-joystick
input_axis_lx=0
input_axis_ly=1
input_axis_rx=3
input_axis_ry=4
input_axis_min=15
input_axis_center=519
input_axis_max=1023
input_touch=1
input_touch_device_name=Hynitron cst3xx Touchscreen

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0

[storage]
storage_emmc_node=/dev/mmcblk1
storage_sd2_node=na
