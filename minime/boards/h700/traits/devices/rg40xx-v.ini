[match]
model=Anbernic RG40XX V
compatible=anbernic,rg40xx-v

[device]
device_id=rg40xx-v
device_model=Anbernic RG40XX V

[screen]
screen_width=640
screen_height=480
# Vertical body with a landscape 640x480 panel: the UI must rotate the
# landscape content to display upright. Exact direction (90 vs 270) to be
# confirmed on-device with `remote screenshot --raw`.
screen_rotation=90
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_axis_lx=2
input_axis_ly=3
input_axis_rx=na
input_axis_ry=na
input_axis_min=-4096
input_axis_center=0
input_axis_max=4096
input_touch=0
input_rumble_device_name=pwm-vibrator

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0
