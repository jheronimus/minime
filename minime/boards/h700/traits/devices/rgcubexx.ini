[match]
model=Anbernic RG CubeXX
compatible=anbernic,rgcubexx

[device]
device_id=rgcubexx
device_model=Anbernic RG CubeXX

[screen]
screen_width=720
screen_height=720
screen_rotation=0
screen_aspect=1:1
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_axis_lx=0
input_axis_ly=1
input_axis_rx=3
input_axis_ry=4
input_axis_min=0
input_axis_center=2048
input_axis_max=4096
input_touch=0
input_rumble_device_name=pwm-vibrator

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0
