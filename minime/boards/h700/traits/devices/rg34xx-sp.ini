[match]
model=Anbernic RG34XX-SP
compatible=anbernic,rg34xx-sp

[device]
device_id=rg34xx-sp
device_model=Anbernic RG34XX-SP

[screen]
screen_width=720
screen_height=480
screen_rotation=0
screen_aspect=3:2
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=na

[input]
# Clamshell: lid switch is exposed as a gpio-keys evdev device.
input_lid_device_name=gpio-keys-lid
input_axis_lx=na
input_axis_ly=na
input_axis_rx=na
input_axis_ry=na
input_axis_min=na
input_axis_center=na
input_axis_max=na
input_touch=0

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0
