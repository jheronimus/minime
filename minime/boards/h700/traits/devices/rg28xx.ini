[match]
model=Anbernic RG28XX
compatible=anbernic,rg28xx

[device]
device_id=rg28xx
device_model=Anbernic RG28XX

[screen]
screen_width=640
screen_height=480
# Portrait-mounted 480x640 panel (panel firmware preset rotation=270,
# panel-firmware-generator "RG 28XX Panel"). The panel does not self-rotate:
# the UI must rotate 270 CW. Verify direction on-device (may be 90).
screen_rotation=270
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_axis_lx=na
input_axis_ly=na
input_axis_rx=na
input_axis_ry=na
input_axis_min=na
input_axis_center=na
input_axis_max=na
input_touch=0

[wireless]
wifi_interface=na
bluetooth_interface=na
