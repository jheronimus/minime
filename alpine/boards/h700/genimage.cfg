image __IMAGE_NAME__ {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot0-uboot {
		in-partition-table = "no"
		image = "boot0_uboot.bin"
		offset = 8K
	}

	partition special {
		partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
		offset = 36M
		size = 16M
	}

	partition boot-resource {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		image = "boot-resource.fat"
	}

	partition env {
		partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
		image = "env.img"
	}

	partition boot {
		partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
		image = "boot.img"
	}

	partition minime {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		image = "userdata.vfat"
	}
}
