# Taskfile for Minime (Alpine OS Foundation).

version: '3'

vars:
  DEFAULT_BOARD: 'h700'

tasks:
  default:
    desc: Build the flashable image for default board (h700)
    cmds:
      - task: build

  build:
    desc: Build flashable SD card image (BOARD=h700|rk3566)
    vars:
      BOARD: '{{.BOARD | default .DEFAULT_BOARD}}'
    cmds:
      - make -C alpine build BOARD={{.BOARD}}

  validate:
    desc: Run fast static checks (pre-push gate)
    cmds:
      - ./alpine/boards/check-boards.sh
      - ./alpine/boards/check-packages.sh
      - |
        set -eu
        shellcheck -s sh \
          alpine/boards/gentraits.sh \
          alpine/boards/check-boards.sh \
          alpine/boards/check-packages.sh \
          alpine/scripts/build.sh \
          alpine/scripts/post-build.sh \
          alpine/scripts/system-image.sh \
          alpine/image/build.sh

  clean:
    desc: Clean build outputs
    cmds:
      - make -C alpine clean
