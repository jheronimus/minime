# Minime Target Disk & Device Configuration File
#
# Copy this file to deploy.cfg in the repository root to specify
# your default SD card device for 'just deploy' / 'just fetch'
# and default target device IP address for 'just remote'.
#
# Format:
#   disk_device=/dev/rdiskN (or /dev/diskN)
#   target_ip=192.168.1.218   (or a mDNS name — every Minime announces itself
#                              as minime.local, or minime-2.local when another
#                              device already claimed minime.local)
#
# GUARD: Automatic deployment using deploy.cfg will ONLY proceed if the
# target disk already contains a partition with the volume label "minime".

disk_device=/dev/rdisk4
target_ip=192.168.1.218
