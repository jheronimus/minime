# Minime Deployment Configuration
# Copy this file to deploy.cfg and fill in your values.

# Target raw disk device (e.g., /dev/rdisk4 on macOS, /dev/sdX on Linux).
# CAUTION: Verify your device name carefully (e.g. diskutil list) before running deploy!
DISK=/dev/rdisk4

# Target board: h700 (RG35XX SP) or rk3566 (RG ARC-D)
BOARD=h700

# Wi-Fi network credentials for automatic connection on boot
WIFI_SSID="YourWiFiSSID"
WIFI_PSK="YourWiFiPassword"

