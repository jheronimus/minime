[match]
model=Anbernic RG34XX-SP
compatible=anbernic,rg34xx-sp

[device]
device_id=rg34xx-sp
device_model=Anbernic RG34XX-SP
parent=rg35xx-sp-v1

[screen]
screen_width=720
screen_height=480
screen_aspect=3:2

# Clamshell: the lid switch is inherited from the RG35XX SP core
# (input_lid_device_name=gpio-keys-lid).

# Derived from the mainline RG35XX SP DTS: identity + wider panel.
[dts]
base=sun50i-h700-anbernic-rg35xx-sp.dts
panel=anbernic,rg34xx-sp-panel