[match]
model=Anbernic RG353V
compatible=anbernic,rg353v

[device]
device_id=rg353v
device_model=Anbernic RG353V

[screen]
screen_width=640
screen_height=480
screen_rotation=270
screen_aspect=4:3
screen_refresh_rate=60

[gpu]
gpu_hdmi_connector=HDMI-A-1

[input]
input_stick_device_name=adc-joystick
input_axis_lx=0
input_axis_ly=1
input_axis_rx=3
input_axis_ry=4
input_axis_min=15
input_axis_center=519
input_axis_max=1023
input_touch=1
input_touch_device_name=Hynitron cst3xx Touchscreen

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0

[storage]
storage_emmc_node=/dev/mmcblk1
storage_sd2_node=na

[audio]
audio_jack_device_name=rk817_int Headphones
