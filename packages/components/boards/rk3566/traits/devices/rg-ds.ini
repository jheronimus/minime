[match]
model=Anbernic RG DS
compatible=anbernic,rg-ds

[device]
device_id=rg-ds
device_model=Anbernic RG DS

[screen]
screen_width=640
screen_height=480
screen_rotation=0
screen_aspect=4:3
screen_refresh_rate=60
screen_backlight_path=/sys/class/backlight/backlight1/brightness
screen2_width=640
screen2_height=480
screen2_rotation=0
screen2_aspect=4:3
screen2_refresh_rate=60
screen2_backlight_path=/sys/class/backlight/backlight/brightness
screen2_blank_path=/sys/class/graphics/fb0/blank
screen2_touch=1
screen2_touch_device_name=Goodix Capacitive TouchScreen

[gpu]
gpu_hdmi_connector=na
gpu_device=/dev/fb1
gpu_device2=/dev/fb0

[audio]
audio_mic=1

[input]
input_stick_device_name=adc-joystick
input_volume_device_name=gpio-keys-volume
input_lid_device_name=gpio-keys-hall
input_axis_lx=0
input_axis_ly=1
input_axis_rx=3
input_axis_ry=4
input_axis_min=15
input_axis_center=519
input_axis_max=1023
input_touch=1
input_touch_device_name=Goodix Capacitive TouchScreen

[wireless]
wifi_interface=wlan0
bluetooth_interface=hci0

[power]
power_led_path=/sys/class/leds/green:power/brightness

[storage]
storage_emmc_node=/dev/mmcblk1
storage_sd2_node=na

# RK3568 SoC (not rk3566): the mainline DTB name carries the rk3568 prefix.
[dts]
dtb=rockchip/rk3568-anbernic-rg-ds
