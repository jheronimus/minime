image __IMAGE_NAME__ {
	hdimage {
		partition-table-type = "gpt"
	}

	partition idbloader {
		in-partition-table = "no"
		image = "idbloader.img"
		offset = 32K
	}

	partition uboot {
		in-partition-table = "no"
		image = "u-boot.itb"
		offset = 8M
	}

	partition boot {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		bootable = "true"
		offset = 16M
		image = "userdata.vfat"
	}

	# Linux-native state partition (ext4) for BlueZ pairing state. Seeded
	# zero-filled; formatted on first boot by init.d/bluetooth. The first-boot
	# expand in initramfs-init.sh grows partition 1 to just before this one.
	partition state {
		partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
		image = "state.ext4"
	}
}
