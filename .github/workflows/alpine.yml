name: Build Alpine images

on:
  workflow_run:
    workflows: ["Build Allium UI assets", "Build MinUI UI assets"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'minime/boards/**'
      - 'minime/uboot/**'
      - 'minime/build/**'
      - 'minime/targets/alpine/**'
      - 'src/**'
      - 'roms/**'
      - 'scripts/**'
      - '.github/workflows/alpine.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      build_h700:
        description: 'Build H700'
        required: false
        default: true
        type: boolean
      build_rk3326:
        description: 'Build RK3326'
        required: false
        default: true
        type: boolean
      build_rk3566:
        description: 'Build RK3566'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-alpine
  cancel-in-progress: true

jobs:
  compute-matrix:
    name: Compute board matrix
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.matrix.outputs.boards }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Select boards
        id: matrix
        uses: ./.github/actions/compute-matrix
        with:
          build_h700: ${{ inputs.build_h700 || true }}
          build_rk3326: ${{ inputs.build_rk3326 || false }}
          build_rk3566: ${{ inputs.build_rk3566 || true }}

  build:
    name: Build Alpine ${{ matrix.board }} (${{ matrix.ui }})
    needs: compute-matrix
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 120
    defaults:
      run:
        working-directory: minime/targets/alpine
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.compute-matrix.outputs.boards) }}
        ui: [minui, allium]
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check for updates
        run: ./scripts/sync-kernel.sh
        working-directory: .

      - name: Manage cache
        uses: ./.github/actions/setup-cache
        with:
          target: alpine
          board: ${{ matrix.board }}

      - name: Build system components
        run: |
          echo "Building Alpine system components for ${{ matrix.board }} (${{ matrix.ui }})"
          make components BOARD=${{ matrix.board }} UI=${{ matrix.ui }}

      - name: Build image
        run: |
          echo "Building Alpine image for ${{ matrix.board }} (${{ matrix.ui }})"
          make image BOARD=${{ matrix.board }} UI=${{ matrix.ui }}

      - name: Upload image and update archive
        run: |
          mv out/${{ matrix.board }}/minime-alpine-${{ matrix.board }}.img.xz out/${{ matrix.board }}/minime-alpine-${{ matrix.board }}-${{ matrix.ui }}.img.xz
          gh release create testing --title "Latest images and update packages" --notes "Rolling release for testing on device" || true
          gh release upload testing out/${{ matrix.board }}/minime-alpine-${{ matrix.board }}-${{ matrix.ui }}.img.xz out/${{ matrix.board }}/minime-alpine-${{ matrix.board }}-${{ matrix.ui }}.tar.xz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
