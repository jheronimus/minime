name: Build Alpine images

on:
  push:
    branches: [main]
    paths:
      - 'minime/boards/**'
      - 'minime/uboot/**'
      - 'minime/genimage/**'
      - 'minime/targets/alpine/**'
      - 'src/**'
      - 'roms/**'
      - 'scripts/**'
      - '.github/workflows/alpine.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      build_h700:
        description: 'Build H700'
        required: false
        default: true
        type: boolean
      build_rk3326:
        description: 'Build RK3326'
        required: false
        default: true
        type: boolean
      build_rk3566:
        description: 'Build RK3566'
        required: false
        default: true
        type: boolean

jobs:
  sync-uis:
    name: Check & Sync UI Releases
    runs-on: ubuntu-latest
    steps:
      - name: Check and Sync UI Release Payloads
        env:
          GH_TOKEN: ${{ secrets.UI_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          sync_ui() {
            repo="$1"

            echo "=== Checking UI staleness for ${repo} ==="
            MAIN_SHA=$(gh api "repos/${repo}/commits/main" -q '.sha' 2>/dev/null || echo "error")
            LATEST_TAG=$(gh api "repos/${repo}/releases/latest" -q '.tag_name' 2>/dev/null || echo "none")

            echo "${repo} main HEAD:   ${MAIN_SHA}"
            echo "${repo} latest tag:  ${LATEST_TAG}"

            if [ "${LATEST_TAG}" != "none" ]; then
              TAG_SHA=$(gh api "repos/${repo}/commits/${LATEST_TAG}" -q '.sha' 2>/dev/null || echo "none")
            else
              TAG_SHA="none"
            fi

            echo "${repo} latest SHA:  ${TAG_SHA}"

            if [ "${MAIN_SHA}" != "error" ] && [ "${MAIN_SHA}" = "${TAG_SHA}" ]; then
              echo "==> ${repo} release ${LATEST_TAG} is UP TO DATE."
            else
              NEW_TAG="v$(date -u +%Y%m%d)"
              echo "==> ${repo} is STALE! Triggering build with tag ${NEW_TAG}..."
              gh workflow run build.yml -R "${repo}" -f "version=${NEW_TAG}"
              sleep 10
              RUN_ID=$(gh run list -R "${repo}" -L 1 --json databaseId -q '.[0].databaseId')
              echo "==> Watching remote build run ${RUN_ID}..."
              gh run watch "${RUN_ID}" -R "${repo}" --exit-status
            fi
          }

          sync_ui "jheronimus/Allium"
          sync_ui "jheronimus/MinUI"

  compute-matrix:
    name: Compute board matrix
    needs: sync-uis
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.set.outputs.boards }}
    steps:
      - name: Select boards
        id: set
        run: |
          boards='["rk3566","rk3326","h700"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            boards=$(echo '[]' \
              | jq -c \
                  --argjson h700   '${{ inputs.build_h700   || true }}' \
                  --argjson rk3326 '${{ inputs.build_rk3326 || true }}' \
                  --argjson rk3566 '${{ inputs.build_rk3566 || true }}' \
                  'if $h700   then . + ["h700"]   else . end |
                   if $rk3326 then . + ["rk3326"] else . end |
                   if $rk3566 then . + ["rk3566"] else . end')
          fi
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Alpine ${{ matrix.board }} (${{ matrix.ui }})
    needs: compute-matrix
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/jheronimus/minime-builder-alpine:latest
      options: --user root
    permissions:
      contents: write
    timeout-minutes: 120
    defaults:
      run:
        working-directory: minime/targets/alpine
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.compute-matrix.outputs.boards) }}
        ui: [minui, allium]
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup & Restore Build Cache
        uses: ./.github/actions/setup-cache
        with:
          target: alpine
          board: ${{ matrix.board }}

      - name: Build Image
        run: |
          echo "Building Alpine image for ${{ matrix.board }} (${{ matrix.ui }})"
          BOARD=${{ matrix.board }} UI=${{ matrix.ui }} ./scripts/build.sh all

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: minime-alpine-${{ matrix.board }}-${{ matrix.ui }}-${{ github.sha }}
          path: minime/targets/alpine/out/${{ matrix.board }}/minime-alpine-${{ matrix.board }}.img.xz
          if-no-files-found: error
          retention-days: 14

      - name: Rename and Upload to Testing Release
        run: |
          cp out/${{ matrix.board }}/minime-alpine-${{ matrix.board }}.img.xz ../../../minime-alpine-${{ matrix.board }}-${{ matrix.ui }}.img.xz
          cd ../../..
          gh release create testing --title "Testing Builds" --notes "Automatically updated on each push" || true
          gh release upload testing minime-alpine-${{ matrix.board }}-${{ matrix.ui }}.img.xz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
