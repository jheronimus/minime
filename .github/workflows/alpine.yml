name: Build Alpine images

on:
  push:
    branches: [main]
    paths:
      - 'minime/boards/**'
      - 'minime/uboot/**'
      - 'minime/genimage/**'
      - 'minime/targets/alpine/**'
      - 'src/**'
      - 'roms/**'
      - 'scripts/**'
      - '.github/workflows/alpine.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      build_h700:
        description: 'Build H700'
        required: false
        default: true
        type: boolean
      build_rk3326:
        description: 'Build RK3326'
        required: false
        default: true
        type: boolean
      build_rk3566:
        description: 'Build RK3566'
        required: false
        default: true
        type: boolean

jobs:
  sync-uis:
    name: Check & Sync UI Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Sync UI Releases
        uses: ./.github/actions/sync-uis
        with:
          github_token: ${{ secrets.UI_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}

  compute-matrix:
    name: Compute board matrix
    needs: sync-uis
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.set.outputs.boards }}
    steps:
      - name: Select boards
        id: set
        run: |
          boards='["rk3566","rk3326","h700"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            boards=$(echo '[]' \
              | jq -c \
                  --argjson h700   '${{ inputs.build_h700   || true }}' \
                  --argjson rk3326 '${{ inputs.build_rk3326 || true }}' \
                  --argjson rk3566 '${{ inputs.build_rk3566 || true }}' \
                  'if $h700   then . + ["h700"]   else . end |
                   if $rk3326 then . + ["rk3326"] else . end |
                   if $rk3566 then . + ["rk3566"] else . end')
          fi
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Alpine ${{ matrix.board }} (${{ matrix.ui }})
    needs: compute-matrix
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 120
    defaults:
      run:
        working-directory: minime/targets/alpine
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.compute-matrix.outputs.boards) }}
        ui: [minui, allium]
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Manage cache
        uses: ./.github/actions/setup-cache
        with:
          target: alpine
          board: ${{ matrix.board }}

      - name: Build system components
        run: |
          echo "Building Alpine system components for ${{ matrix.board }} (${{ matrix.ui }})"
          make components BOARD=${{ matrix.board }} UI=${{ matrix.ui }}

      - name: Build image
        run: |
          echo "Building Alpine image for ${{ matrix.board }} (${{ matrix.ui }})"
          make image BOARD=${{ matrix.board }} UI=${{ matrix.ui }}

      - name: Upload image
        run: |
          cp out/${{ matrix.board }}/minime-alpine-${{ matrix.board }}.img.xz ../../../minime-alpine-${{ matrix.board }}-${{ matrix.ui }}.img.xz
          cd ../../..
          gh release create testing --title "Testing Builds" --notes "Automatically updated on each push" || true
          gh release upload testing minime-alpine-${{ matrix.board }}-${{ matrix.ui }}.img.xz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
