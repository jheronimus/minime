name: Update UI submodules

on:
  schedule:
    - cron: '0 2 * * *'
  repository_dispatch:
    types: [update-submodules]

permissions:
  contents: write

jobs:
  update-submodules:
    name: Update Submodules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.UI_UPDATE || secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest main
        run: |
          git submodule update --remote --merge
          # muos/internal is update=none (sparse payload, skipped by recursive
          # checkout) so bump it explicitly to the latest main tip.
          packages/ui/muos-checkout-internal.sh main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ui/allium packages/ui/minui packages/ui/muos/frontend packages/ui/muos/internal
          if git diff --staged --quiet; then
            echo "Submodules are up-to-date."
          else
            git commit -m "chore(submodules): update UI submodules to latest main"
            git push origin main
          fi
