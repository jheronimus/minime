name: Build Allium UI assets

on:
  push:
    branches: [main]
    paths:
      - 'minime/ui/allium/**'
      - '.github/workflows/allium.yml'
  workflow_dispatch:

concurrency:
  group: build-allium
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-allium:
    name: Build Allium (${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: musl
            runner: ubuntu-24.04-arm
            container: ghcr.io/${{ github.repository_owner }}/minime-builder-alpine:latest
            target: aarch64-unknown-linux-musl
          - libc: glibc
            runner: ubuntu-latest
            container: ghcr.io/${{ github.repository_owner }}/minime-builder-buildroot:latest
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.UI_UPDATE || secrets.GITHUB_TOKEN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "minime/ui/allium"
          key: ${{ matrix.target }}

      - name: Build Allium binaries
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then
            # Build natively in Alpine arm64 (no --target needed as it's native)
            docker run --rm --user root \
              -v ${{ github.workspace }}:/workspace \
              -v ~/.cargo/registry:/root/.cargo/registry \
              ${{ matrix.container }} \
              /bin/bash -c "cd /workspace/minime/ui/allium && cargo build --release --features minime \
                --bin alliumd --bin allium-launcher --bin allium-menu \
                --bin activity-tracker --bin screenshot --bin screenshot-viewer \
                --bin say --bin show"
            
            # Create a symlink to match the target path expectations
            mkdir -p minime/ui/allium/target/${{ matrix.target }}
            ln -sf ../release minime/ui/allium/target/${{ matrix.target }}/release
          else
            # Cross-compile in Debian amd64
            docker run --rm --user root \
              -v ${{ github.workspace }}:/workspace \
              -v ~/.cargo/registry:/root/.cargo/registry \
              -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
              ${{ matrix.container }} \
              /bin/bash -c "cd /workspace/minime/ui/allium && cargo build --release --target ${{ matrix.target }} --features minime \
                --bin alliumd --bin allium-launcher --bin allium-menu \
                --bin activity-tracker --bin screenshot --bin screenshot-viewer \
                --bin say --bin show"
          fi

      - name: Assemble & Package Archive
        run: |
          BUILD=minime/ui/allium/target/${{ matrix.target }}/release
          STATIC=minime/ui/allium/static
          STAGE_DIR=$(mktemp -d)

          mkdir -p "$STAGE_DIR/.ui/bin"
          mkdir -p "$STAGE_DIR/.ui/config"
          mkdir -p "$STAGE_DIR/.ui/state"
          mkdir -p "$STAGE_DIR/.ui/themes"
          mkdir -p "$STAGE_DIR/.ui/fonts"
          mkdir -p "$STAGE_DIR/.tmp_update/bin"
          mkdir -p "$STAGE_DIR/apps"
          mkdir -p "$STAGE_DIR/RetroArch"
          mkdir -p "$STAGE_DIR/Roms"
          mkdir -p "$STAGE_DIR/Saves"
          mkdir -p "$STAGE_DIR/BIOS"

          cp $BUILD/alliumd "$STAGE_DIR/.ui/bin/"
          cp $BUILD/allium-launcher "$STAGE_DIR/.ui/bin/"
          cp $BUILD/allium-menu "$STAGE_DIR/.ui/bin/"
          cp $BUILD/screenshot "$STAGE_DIR/.tmp_update/bin/"
          cp $BUILD/say "$STAGE_DIR/.tmp_update/bin/"
          cp $BUILD/show "$STAGE_DIR/.tmp_update/bin/"

          cp $BUILD/activity-tracker "$STAGE_DIR/apps/Activity Tracker.pak/" || true
          cp $BUILD/screenshot-viewer "$STAGE_DIR/apps/Screenshot Viewer.pak/" || true

          cp -r "$STATIC/Apps/Activity Tracker.pak/." "$STAGE_DIR/apps/Activity Tracker.pak/" || true
          cp -r "$STATIC/Apps/Screenshot Viewer.pak/." "$STAGE_DIR/apps/Screenshot Viewer.pak/" || true
          cp -r "$STATIC/Apps/"*.pak "$STAGE_DIR/apps/" 2>/dev/null || true

          cp -r "$STATIC/RetroArch/." "$STAGE_DIR/RetroArch/" || true
          [ -d "$STATIC/.minime" ] && cp -r "$STATIC/.minime" "$STAGE_DIR/" || true

          mkdir -p minime/ui/out
          OUT_TAR="minime/ui/out/allium-${{ matrix.libc }}-aarch64.tar.xz"
          tar -cJf "$OUT_TAR" -C "$STAGE_DIR" .
          echo "Created $OUT_TAR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: allium-${{ matrix.libc }}-aarch64
          path: minime/ui/out/allium-${{ matrix.libc }}-aarch64.tar.xz
          retention-days: 7

  upload-assets:
    name: Upload prebuilt Allium assets to Release
    runs-on: ubuntu-latest
    needs: build-allium
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Upload UI assets
        uses: ./.github/actions/upload-ui-assets
        with:
          artifact_prefix: allium
          github_token: ${{ secrets.GITHUB_TOKEN }}
