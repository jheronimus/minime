name: Build MinUI UI assets

on:
  push:
    branches: [main]
    paths:
      - 'minime/ui/minui/**'
      - '.github/workflows/minui.yml'
  workflow_dispatch:

concurrency:
  group: build-minui
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-minui:
    name: Build MinUI (${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: musl
            runner: ubuntu-24.04-arm
            container: ghcr.io/${{ github.repository_owner }}/minime-builder-alpine:latest
          - libc: glibc
            runner: ubuntu-latest
            container: ghcr.io/${{ github.repository_owner }}/minime-builder-buildroot:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.UI_UPDATE || secrets.GITHUB_TOKEN }}

      - name: Cache C/C++ compilation (MinUI)
        uses: actions/cache@v4
        with:
          path: ~/.minui-ccache-${{ matrix.libc }}
          key: minui-ccache-${{ matrix.libc }}-${{ hashFiles('minime/ui/minui/**') }}
          restore-keys: |
            minui-ccache-${{ matrix.libc }}-

      - name: Build MinUI binaries
        run: |
          cd minime/ui/minui
          make setup
          mkdir -p ~/.minui-ccache-${{ matrix.libc }}
          
          if [ "${{ matrix.libc }}" = "musl" ]; then
            docker run --rm --user root \
              -v ~/.minui-ccache-${{ matrix.libc }}:/alpine-ccache \
              -v ${{ github.workspace }}:/workspace \
              ${{ matrix.container }} \
              /bin/bash -c "cd /workspace/minime/ui/minui/workspace && make CC=\"ccache gcc\" CXX=\"ccache g++\" PLATFORM=minime && cd .. && make system cores PLATFORM=minime"
          else
            docker run --rm --user root \
              -v ~/.minui-ccache-${{ matrix.libc }}:/alpine-ccache \
              -v ${{ github.workspace }}:/workspace \
              ${{ matrix.container }} \
              /bin/bash -c "cd /workspace/minime/ui/minui/workspace && make CC=\"ccache aarch64-linux-gnu-gcc\" CXX=\"ccache aarch64-linux-gnu-g++\" PLATFORM=minime && cd .. && make system cores PLATFORM=minime"
          fi
          
          make package

      - name: Package & Stage Archive
        run: |
          mkdir -p minime/ui/out
          STAGE_DIR=$(mktemp -d)
          for zipfile in minime/ui/minui/releases/*.zip; do
            [ -f "$zipfile" ] || continue
            unzip -q -o "$zipfile" -d "$STAGE_DIR"
          done
          tar -cJf minime/ui/out/minui-${{ matrix.libc }}-aarch64.tar.xz -C "$STAGE_DIR" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minui-${{ matrix.libc }}-aarch64
          path: minime/ui/out/minui-${{ matrix.libc }}-aarch64.tar.xz
          retention-days: 7

  upload-assets:
    name: Upload prebuilt MinUI assets to Release
    runs-on: ubuntu-latest
    needs: build-minui
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Upload UI assets
        uses: ./.github/actions/upload-ui-assets
        with:
          artifact_prefix: minui
          github_token: ${{ secrets.GITHUB_TOKEN }}
