name: Build MinUI UI assets

on:
  push:
    branches: [main]
    paths:
      - 'minime/ui/minui/**'
      - '.github/workflows/minui.yml'
  workflow_dispatch:

concurrency:
  group: build-minui
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-minui:
    name: Build MinUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.UI_UPDATE || secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v5
        with:
          context: minime/ui/minui/toolchains/minime-toolchain
          load: true
          tags: minime-toolchain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MinUI binaries
        run: |
          cd minime/ui/minui
          make setup
          docker run --rm \
            -v ${{ github.workspace }}/minime/ui/minui/workspace:/root/workspace \
            minime-toolchain \
            /bin/bash -c '. ~/.bashrc && make'
          make system PLATFORM=minime
          make cores PLATFORM=minime
          make package

      - name: Package & Stage Archive
        run: |
          mkdir -p minime/ui/out
          STAGE_DIR=$(mktemp -d)
          for zipfile in minime/ui/minui/releases/*.zip; do
            [ -f "$zipfile" ] || continue
            unzip -q -o "$zipfile" -d "$STAGE_DIR"
          done
          tar -cJf minime/ui/out/minui-glibc-aarch64.tar.xz -C "$STAGE_DIR" .
          cp minime/ui/out/minui-glibc-aarch64.tar.xz minime/ui/out/minui-musl-aarch64.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minui-assets
          path: minime/ui/out/minui-*.tar.xz
          retention-days: 7

  commit-assets:
    name: Commit prebuilt MinUI assets
    needs: build-minui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.UI_UPDATE || secrets.GITHUB_TOKEN }}

      - name: Download MinUI artifacts
        uses: actions/download-artifact@v4
        with:
          name: minui-assets
          path: minime/ui/out

      - name: Commit and push updated UI assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add minime/ui/out/minui-*.tar.xz
          if git diff --staged --quiet; then
            echo "No changes to MinUI assets."
          else
            git commit -m "chore(ui): update prebuilt MinUI UI assets"
            for i in 1 2 3 4 5; do
              git push origin main && break
              echo "Push failed (attempt $i/5), rebasing and retrying..."
              git pull --rebase origin main
            done
          fi
