name: Build MinUI UI assets

on:
  push:
    branches: [main]
    paths:
      - 'minime/ui/minui/**'
      - '.github/workflows/minui.yml'
  workflow_dispatch:

concurrency:
  group: build-minui
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-minui:
    name: Build MinUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.UI_UPDATE || secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Cache C/C++ compilation (MinUI)
        uses: actions/cache@v4
        with:
          path: ~/.minui-ccache
          key: minui-ccache-${{ hashFiles('minime/ui/minui/**') }}
          restore-keys: |
            minui-ccache-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inject ccache into toolchain Dockerfile
        run: |
          sed -i 's/crossbuild-essential-arm64 \\/crossbuild-essential-arm64 \\\n        ccache \\/g' minime/ui/minui/toolchains/minime-toolchain/Dockerfile

      - name: Build toolchain image
        uses: docker/build-push-action@v5
        with:
          context: minime/ui/minui/toolchains/minime-toolchain
          load: true
          tags: minime-toolchain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MinUI binaries
        run: |
          cd minime/ui/minui
          make setup
          mkdir -p ~/.minui-ccache
          docker run --rm \
            -v ~/.minui-ccache:/root/.ccache \
            -e CCACHE_DIR=/root/.ccache \
            -v ${{ github.workspace }}/minime/ui/minui/workspace:/root/workspace \
            minime-toolchain \
            /bin/bash -c '. ~/.bashrc && make CC="ccache aarch64-linux-gnu-gcc" CXX="ccache aarch64-linux-gnu-g++"'
          make system PLATFORM=minime
          make cores PLATFORM=minime
          make package

      - name: Package & Stage Archive
        run: |
          mkdir -p minime/ui/out
          STAGE_DIR=$(mktemp -d)
          for zipfile in minime/ui/minui/releases/*.zip; do
            [ -f "$zipfile" ] || continue
            unzip -q -o "$zipfile" -d "$STAGE_DIR"
          done
          tar -cJf minime/ui/out/minui-glibc-aarch64.tar.xz -C "$STAGE_DIR" .
          cp minime/ui/out/minui-glibc-aarch64.tar.xz minime/ui/out/minui-musl-aarch64.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minui-assets
          path: minime/ui/out/minui-*.tar.xz
          retention-days: 7

  upload-assets:
    name: Upload prebuilt MinUI assets to Release
    runs-on: ubuntu-latest
    needs: build-minui
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Upload UI assets
        uses: ./.github/actions/upload-ui-assets
        with:
          artifact_prefix: minui
          github_token: ${{ secrets.GITHUB_TOKEN }}
