name: Upload UI assets

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: 'Prefix for artifacts to download (e.g. allium, minui)'
        required: true
        type: string

jobs:
  upload-assets:
    name: Upload prebuilt ${{ inputs.artifact_prefix }} assets to Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download musl artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-musl-aarch64
          path: minime/ui/out
        continue-on-error: true

      - name: Download glibc artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-glibc-aarch64
          path: minime/ui/out
        continue-on-error: true

      - name: Download consolidated artifact (if used)
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-assets
          path: minime/ui/out
        continue-on-error: true

      - name: Upload to UI rolling release
        run: |
          gh release create latest-ui --title "Latest UI Assets" --notes "Rolling release for UI prebuilts" || true
          gh release upload latest-ui minime/ui/out/${{ inputs.artifact_prefix }}-*.tar.xz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
