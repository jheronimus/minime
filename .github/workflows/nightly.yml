name: Nightly Rebuilds

on:
  schedule:
    # 04:00 UTC = 07:00 GMT+3 — nightly rebuild of MinUI targets
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      include_roms:
        description: 'Include preloaded ROMs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  nightly-build:
    name: ${{ matrix.libc }} / ${{ matrix.soc }} / ${{ matrix.ui }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine (musl) — 3 boards × MinUI
          - libc: alpine
            soc: rk3566
            ui: minui
          - libc: alpine
            soc: rk3326
            ui: minui
          - libc: alpine
            soc: h700
            ui: minui
          # Buildroot (glibc) — 3 boards × MinUI
          - libc: buildroot
            soc: rk3566
            ui: minui
          - libc: buildroot
            soc: rk3326
            ui: minui
          - libc: buildroot
            soc: h700
            ui: minui
    uses: ./.github/workflows/build.yml
    with:
      libc: ${{ matrix.libc }}
      soc: ${{ matrix.soc }}
      ui: ${{ matrix.ui }}
      include_roms: ${{ inputs.include_roms || false }}
    secrets: inherit
