name: Update cores

on:
  schedule:
    - cron: '30 2 * * *'
  repository_dispatch:
    types: [update-cores]

permissions:
  contents: write

jobs:
  update-cores:
    name: Bump core pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump autobump core hashes
        run: |
          python3 - <<'PYEOF'
          import os, subprocess

          manifest = "minime/build/cores/manifest"
          changed = False
          lines = open(manifest).read().splitlines()
          out = []
          for line in lines:
              if not line or line.startswith("#"):
                  out.append(line)
                  continue
              fields = line.split("|")
              if len(fields) != 11:
                  out.append(line)
                  continue
              core, repo, hash_, buildpath, makefile, flags, patch, platform, core_so, optional, autobump = fields
              if autobump != "1" or not repo or not hash_:
                  out.append(line)
                  continue
              try:
                  head = subprocess.run(
                      ["git", "ls-remote", repo, "HEAD"],
                      capture_output=True, text=True, check=True, timeout=60,
                  ).stdout.split()[0]
              except Exception as e:
                  print(f"  [skip] {core}: {e}")
                  out.append(line)
                  continue
              if head != hash_:
                  fields[2] = head
                  line = "|".join(fields)
                  print(f"  {core}: {hash_[:12]} -> {head[:12]}")
                  changed = True
              out.append(line)
          open(manifest, "w").write("\n".join(out) + "\n")
          if changed:
              print("manifest updated")
          else:
              print("cores are up-to-date")
          PYEOF

      - name: Commit and push
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add minime/build/cores/manifest
          if git diff --staged --quiet; then
            echo "No core changes."
          else
            git commit -m "chore(cores): bump autobump core pins to latest"
            git push origin main
          fi
