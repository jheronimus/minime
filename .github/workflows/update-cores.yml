name: Update cores

on:
  schedule:
    - cron: '30 2 * * *'
  repository_dispatch:
    types: [update-cores]

permissions:
  contents: write

jobs:
  update-cores:
    name: Bump core pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump autobump core hashes
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, subprocess

          changed = False
          for ini_path in sorted(glob.glob("packages/cores/*/core.ini")):
              core = os.path.basename(os.path.dirname(ini_path))
              content = open(ini_path).read()

              autobump_match = re.search(r"^autobump\s*=\s*(.*)$", content, re.MULTILINE)
              repo_match = re.search(r"^repo\s*=\s*(.*)$", content, re.MULTILINE)
              hash_match = re.search(r"^hash\s*=\s*(.*)$", content, re.MULTILINE)

              if not (autobump_match and repo_match and hash_match):
                  continue

              autobump = autobump_match.group(1).strip()
              repo = repo_match.group(1).strip()
              hash_ = hash_match.group(1).strip()

              if autobump != "1" or not repo or not hash_:
                  continue

              try:
                  head = subprocess.run(
                      ["git", "ls-remote", repo, "HEAD"],
                      capture_output=True, text=True, check=True, timeout=60,
                  ).stdout.split()[0]
              except Exception as e:
                  print(f"  [skip] {core}: {e}")
                  continue

              if head != hash_:
                  new_content = re.sub(r"^hash\s*=.*$", f"hash = {head}", content, flags=re.MULTILINE)
                  open(ini_path, "w").write(new_content)
                  print(f"  {core}: {hash_[:12]} -> {head[:12]}")
                  changed = True

          if changed:
              print("cores updated")
          else:
              print("cores are up-to-date")
          PYEOF

      - name: Commit and push
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cores
          if git diff --staged --quiet; then
            echo "No core changes."
          else
            git commit -m "chore(cores): bump autobump core pins to latest"
            git push origin main
          fi
