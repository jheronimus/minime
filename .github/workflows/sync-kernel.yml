name: Sync kernel versions

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update:
    name: Run synckernel.py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run sync-kernel.sh
        run: ./scripts/sync-kernel.sh

      - name: Commit and push changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "kernel: sync versions between alpine and buildroot via sync-kernel.sh"
            git push
          else
            echo "No changes to commit"
          fi
