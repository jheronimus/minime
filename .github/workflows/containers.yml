name: Build & Push Container Images

on:
  push:
    branches: [main]
    paths:
      - 'minime/targets/alpine/container/**'
      - 'minime/targets/buildroot/container/**'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-alpine-container:
    name: Build & Push Alpine Builder Image (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Alpine container
        uses: docker/build-push-action@v5
        with:
          context: minime/targets/alpine
          file: minime/targets/alpine/container/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minime-builder-alpine:latest
            ghcr.io/${{ github.repository_owner }}/minime-builder-alpine:${{ github.sha }}

  build-buildroot-container:
    name: Build & Push Buildroot Builder Image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Buildroot container
        uses: docker/build-push-action@v5
        with:
          context: minime/targets/buildroot
          file: minime/targets/buildroot/container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minime-builder-buildroot:latest
            ghcr.io/${{ github.repository_owner }}/minime-builder-buildroot:${{ github.sha }}
