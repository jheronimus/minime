name: Build & push container images

on:
  push:
    branches: [main]
    paths:
      - 'packages/components/alpine/container/**'
      - 'packages/components/buildroot/container/**'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-musl-container:
    name: Build & Push musl Builder Image (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push musl container
        uses: docker/build-push-action@v7
        with:
          context: packages/components/alpine/container
          file: packages/components/alpine/container/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minime-musl:latest
            ghcr.io/${{ github.repository_owner }}/minime-musl:${{ github.sha }}

  build-glibc-container:
    name: Build & Push glibc Builder Image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push glibc container
        uses: docker/build-push-action@v7
        with:
          context: packages/components/buildroot
          file: packages/components/buildroot/container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minime-glibc:latest
            ghcr.io/${{ github.repository_owner }}/minime-glibc:${{ github.sha }}
