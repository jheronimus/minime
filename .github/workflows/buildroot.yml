name: Build Buildroot images

on:
  workflow_run:
    workflows: ["Build Allium UI assets", "Build MinUI UI assets"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'minime/boards/**'
      - 'minime/uboot/**'
      - 'minime/build/**'
      - 'minime/targets/buildroot/**'
      - 'src/**'
      - 'roms/**'
      - 'scripts/**'
      - '.github/workflows/buildroot.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      build_h700:
        description: 'Build H700'
        required: false
        default: false
        type: boolean
      build_rk3326:
        description: 'Build RK3326'
        required: false
        default: true
        type: boolean
      build_rk3566:
        description: 'Build RK3566'
        required: false
        default: true
        type: boolean
      clean_output:
        description: 'Clean the board output directories before building'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-buildroot
  cancel-in-progress: true

jobs:
  compute-matrix:
    uses: ./.github/workflows/compute-matrix.yml
    with:
      build_h700: ${{ inputs.build_h700 || false }}
      build_rk3326: ${{ inputs.build_rk3326 || false }}
      build_rk3566: ${{ inputs.build_rk3566 || true }}

  shared-sources:
    name: Download sources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minime/targets/buildroot
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Manage cache
        id: cache-dl
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-dl
          key: minime-buildroot-dl

      - name: Download sources for all boards
        if: steps.cache-dl.outputs.cache-hit != 'true'
        run: |
          for board in rk3566; do
            echo "Downloading sources for $board..."
            BOARD=$board ./scripts/build.sh source
          done

  build-components:
    name: Build Buildroot ${{ matrix.board }} components
    needs: [compute-matrix, shared-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: minime/targets/buildroot
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.compute-matrix.outputs.boards) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check for updates
        run: python3 scripts/synckernel/synckernel.py
        working-directory: .

      - name: Manage cache
        uses: ./.github/actions/setup-cache
        with:
          target: buildroot
          board: ${{ matrix.board }}

      - name: Clean build dir
        if: ${{ inputs.clean_output }}
        run: |
          echo "Cleaning output for ${{ matrix.board }}"
          make clean BOARD=${{ matrix.board }}

      - name: Build system components
        run: |
          echo "Building Buildroot system components for ${{ matrix.board }}"
          make components BOARD=${{ matrix.board }}

      - name: Upload components artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-components-${{ matrix.board }}-${{ github.sha }}
          path: minime/targets/buildroot/out/${{ matrix.board }}
          retention-days: 1

  build-image:
    name: Build Buildroot ${{ matrix.board }} (${{ matrix.ui }}) image
    needs: [build-components, compute-matrix]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: minime/targets/buildroot
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.compute-matrix.outputs.boards) }}
        ui: [minui, allium]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download components artifact
        uses: actions/download-artifact@v4
        with:
          name: buildroot-components-${{ matrix.board }}-${{ github.sha }}
          path: minime/targets/buildroot/out/${{ matrix.board }}

      - name: Build image
        run: |
          echo "Building Buildroot image for ${{ matrix.board }} (${{ matrix.ui }})"
          make image BOARD=${{ matrix.board }} UI=${{ matrix.ui }}

      - name: Upload image and update archive
        run: |
          git config --global --add safe.directory /__w/minime/minime
          mv out/${{ matrix.board }}/minime-buildroot-${{ matrix.board }}.img.xz out/${{ matrix.board }}/minime-buildroot-${{ matrix.board }}-${{ matrix.ui }}.img.xz
          gh release create testing --title "Testing Builds" --notes "Automatically updated on each push" || true
          gh release upload testing out/${{ matrix.board }}/minime-buildroot-${{ matrix.board }}-${{ matrix.ui }}.img.xz out/${{ matrix.board }}/minime-buildroot-${{ matrix.board }}-${{ matrix.ui }}.tar.xz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
