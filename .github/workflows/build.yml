name: Build Minime

on:
  push:
    branches: [main]
    paths:
      - 'minime/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'minime/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bootloader:
    name: Build Bootloader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Bootloader Cache
        id: cache-bootloader-restore
        uses: actions/cache/restore@v6
        with:
          path: minime/uboot/out
          key: bootloader-${{ hashFiles('minime/uboot/config/**', 'minime/uboot/patches/**', 'minime/boards/*/patches/uboot/**', 'minime/build/mkbootloader.sh') }}

      - name: Restore Bootloader CCache
        id: ccache-bootloader-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.bootloader-ccache
          key: ccache-bootloader-${{ github.sha }}
          restore-keys: |
            ccache-bootloader-

      - name: Compile Bootloader
        if: steps.cache-bootloader-restore.outputs.cache-hit != 'true' || hashFiles('minime/uboot/out/h700/u-boot-sunxi-with-spl.bin', 'minime/uboot/out/rk3326/idbloader.img', 'minime/uboot/out/rk3566/idbloader.img') == ''
        run: |
          docker run --rm -u root \
            -v "$HOME/.bootloader-ccache:/root/.ccache" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "ghcr.io/${{ github.repository_owner }}/minime-glibc:latest" \
            /bin/bash -c "minime/build/mkbootloader.sh rk3326 2026.07 && minime/build/mkbootloader.sh rk3566 2026.07 && minime/build/mkbootloader.sh h700 2026.07 && chown -R \$(stat -c '%u:%g' /workspace) /workspace/minime/uboot/out"
          sudo chown -R "$USER:$USER" minime/uboot/out

      - name: Save Bootloader Cache
        if: always() && (steps.cache-bootloader-restore.outputs.cache-hit != 'true' || hashFiles('minime/uboot/out/h700/u-boot-sunxi-with-spl.bin', 'minime/uboot/out/rk3326/idbloader.img', 'minime/uboot/out/rk3566/idbloader.img') == '')
        uses: actions/cache/save@v6
        with:
          path: minime/uboot/out
          key: bootloader-${{ hashFiles('minime/uboot/config/**', 'minime/uboot/patches/**', 'minime/boards/*/patches/uboot/**', 'minime/build/mkbootloader.sh') }}

      - name: Save Bootloader CCache
        if: always() && steps.ccache-bootloader-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bootloader-ccache
          key: ccache-bootloader-${{ github.sha }}

      - name: Upload Bootloader Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootloader-out
          path: minime/uboot/out
          retention-days: 7

  build-cores:
    name: Build Cores (${{ matrix.libc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: musl
            runner: ubuntu-24.04-arm
            container: ghcr.io/${{ github.repository_owner }}/minime-musl:latest
            cross_compile: 'ccache '
            cc: 'ccache gcc'
            cxx: 'ccache g++'
            ar: ar
          - libc: glibc
            runner: ubuntu-latest
            container: ghcr.io/${{ github.repository_owner }}/minime-glibc:latest
            cross_compile: 'ccache aarch64-linux-gnu-'
            cc: 'ccache aarch64-linux-gnu-gcc'
            cxx: 'ccache aarch64-linux-gnu-g++'
            ar: aarch64-linux-gnu-ar
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Cores Cache
        id: cache-cores-restore
        uses: actions/cache/restore@v6
        with:
          path: minime/build/cores/out
          key: cores-${{ matrix.libc }}-${{ hashFiles('minime/build/cores/manifest', 'minime/build/cores/buildcores.sh', 'minime/build/cores/patches/**') }}

      - name: Restore Cores CCache
        id: ccache-cores-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cores-ccache-${{ matrix.libc }}
          key: ccache-cores-${{ matrix.libc }}-${{ github.sha }}
          restore-keys: |
            ccache-cores-${{ matrix.libc }}-

      - name: Build Cores
        if: steps.cache-cores-restore.outputs.cache-hit != 'true' || hashFiles('minime/build/cores/out/cores.txt') == ''
        env:
          CROSS_COMPILE: ${{ matrix.cross_compile }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          AR: ${{ matrix.ar }}
        run: |
          docker run --rm -u root \
            -v "$HOME/.cores-ccache-${{ matrix.libc }}:/root/.ccache" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --env CROSS_COMPILE --env CC --env CXX --env AR \
            "${{ matrix.container }}" \
            /bin/bash -c "minime/build/cores/buildcores.sh && chown -R \$(stat -c '%u:%g' /workspace) /workspace/minime/build/cores/out"

      - name: Save Cores Cache
        if: always() && (steps.cache-cores-restore.outputs.cache-hit != 'true' || hashFiles('minime/build/cores/out/cores.txt') == '')
        uses: actions/cache/save@v6
        with:
          path: minime/build/cores/out
          key: cores-${{ matrix.libc }}-${{ hashFiles('minime/build/cores/manifest', 'minime/build/cores/buildcores.sh', 'minime/build/cores/patches/**') }}

      - name: Save Cores CCache
        if: always() && steps.ccache-cores-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cores-ccache-${{ matrix.libc }}
          key: ccache-cores-${{ matrix.libc }}-${{ github.sha }}

      - name: Upload Cores Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cores-${{ matrix.libc }}
          path: minime/build/cores/out
          retention-days: 7

  build-ui-musl:
    name: Build UI (musl)
    needs: [build-cores]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore UI Cache
        id: cache-ui-restore
        uses: actions/cache/restore@v6
        with:
          path: minime/ui/out
          key: ui-musl-${{ hashFiles('.git/modules/minime/ui/allium/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/modules/submodules/RetroArch/HEAD', '.git/modules/minime/ui/minui/HEAD', 'minime/build/mkui.sh') }}

      - name: Restore UI CCache
        id: ccache-ui-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.ui-ccache-musl
          key: ccache-ui-musl-${{ github.sha }}
          restore-keys: |
            ccache-ui-musl-

      - name: Restore Allium Cargo Target
        id: cargo-target-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            minime/ui/allium/target
            minime/ui/allium/third-party/dufs/target
            minime/ui/allium/third-party/collie/target
          key: allium-target-musl-${{ hashFiles('minime/ui/allium/Cargo.lock', 'minime/ui/allium/third-party/dufs/Cargo.lock', 'minime/ui/allium/third-party/collie/Cargo.lock') }}
          restore-keys: |
            allium-target-musl-

      - name: Download Cores
        uses: actions/download-artifact@v8
        with:
          name: cores-musl
          path: minime/build/cores/out

      - name: Compile MinUI
        if: steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/minui-{0}-aarch64.tar.zst', 'musl')) == ''
        run: |
          minime/build/mkui.sh minui musl

      - name: Compile Allium
        if: steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.zst', 'musl')) == ''
        run: |
          minime/build/mkui.sh allium musl

      - name: Save Allium Cargo Target
        if: always() && (steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.zst', 'musl')) == '')
        uses: actions/cache/save@v6
        with:
          path: |
            minime/ui/allium/target
            minime/ui/allium/third-party/dufs/target
            minime/ui/allium/third-party/collie/target
          key: allium-target-musl-${{ hashFiles('minime/ui/allium/Cargo.lock', 'minime/ui/allium/third-party/dufs/Cargo.lock', 'minime/ui/allium/third-party/collie/Cargo.lock') }}

      - name: Save UI Cache
        if: always() && (steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/minui-{0}-aarch64.tar.zst', 'musl')) == '' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.zst', 'musl')) == '')
        uses: actions/cache/save@v6
        with:
          path: minime/ui/out
          key: ui-musl-${{ hashFiles('.git/modules/minime/ui/allium/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/modules/submodules/RetroArch/HEAD', '.git/modules/minime/ui/minui/HEAD', 'minime/build/mkui.sh') }}

      - name: Save UI CCache
        if: always() && steps.ccache-ui-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ui-ccache-musl
          key: ccache-ui-musl-${{ github.sha }}

      - name: Upload UI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-musl
          path: minime/ui/out
          retention-days: 7


  build-ui-glibc:
    name: Build UI (glibc)
    needs: [build-cores]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore UI Cache
        id: cache-ui-restore
        uses: actions/cache/restore@v6
        with:
          path: minime/ui/out
          key: ui-glibc-${{ hashFiles('.git/modules/minime/ui/allium/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/modules/submodules/RetroArch/HEAD', '.git/modules/minime/ui/minui/HEAD', 'minime/build/mkui.sh') }}

      - name: Restore UI CCache
        id: ccache-ui-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.ui-ccache-glibc
          key: ccache-ui-glibc-${{ github.sha }}
          restore-keys: |
            ccache-ui-glibc-

      - name: Restore Allium Cargo Target
        id: cargo-target-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            minime/ui/allium/target
            minime/ui/allium/third-party/dufs/target
            minime/ui/allium/third-party/collie/target
          key: allium-target-glibc-${{ hashFiles('minime/ui/allium/Cargo.lock', 'minime/ui/allium/third-party/dufs/Cargo.lock', 'minime/ui/allium/third-party/collie/Cargo.lock') }}
          restore-keys: |
            allium-target-glibc-

      - name: Download Cores
        uses: actions/download-artifact@v8
        with:
          name: cores-glibc
          path: minime/build/cores/out

      - name: Compile MinUI
        if: steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/minui-{0}-aarch64.tar.zst', 'glibc')) == ''
        run: |
          minime/build/mkui.sh minui glibc

      - name: Compile Allium
        if: steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.zst', 'glibc')) == ''
        run: |
          minime/build/mkui.sh allium glibc

      - name: Save Allium Cargo Target
        if: always() && (steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.zst', 'glibc')) == '')
        uses: actions/cache/save@v6
        with:
          path: |
            minime/ui/allium/target
            minime/ui/allium/third-party/dufs/target
            minime/ui/allium/third-party/collie/target
          key: allium-target-glibc-${{ hashFiles('minime/ui/allium/Cargo.lock', 'minime/ui/allium/third-party/dufs/Cargo.lock', 'minime/ui/allium/third-party/collie/Cargo.lock') }}

      - name: Save UI Cache
        if: always() && (steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/minui-{0}-aarch64.tar.zst', 'glibc')) == '' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.zst', 'glibc')) == '')
        uses: actions/cache/save@v6
        with:
          path: minime/ui/out
          key: ui-glibc-${{ hashFiles('.git/modules/minime/ui/allium/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/HEAD', '.git/modules/minime/ui/allium/modules/third-party/RetroArch-patch/modules/submodules/RetroArch/HEAD', '.git/modules/minime/ui/minui/HEAD', 'minime/build/mkui.sh') }}

      - name: Save UI CCache
        if: always() && steps.ccache-ui-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ui-ccache-glibc
          key: ccache-ui-glibc-${{ github.sha }}

      - name: Upload UI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-glibc
          path: minime/ui/out
          retention-days: 7


  build-os-musl:
    name: Build OS (alpine / ${{ matrix.board }})
    needs: [build-bootloader, build-ui-musl]
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: h700
            runner: ubuntu-24.04-arm
          - board: rk3326
            runner: ubuntu-24.04-arm
          - board: rk3566
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Bootloader
        uses: actions/download-artifact@v8
        with:
          name: bootloader-out
          path: minime/uboot/out

      - name: Download UI
        uses: actions/download-artifact@v8
        with:
          name: ui-musl
          path: minime/ui/out

      - name: Restore CCache
        id: ccache-os-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/alpine-ccache
            ~/.buildroot-ccache
          key: ccache-alpine-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            ccache-alpine-${{ matrix.board }}-

      - name: Restore DL Cache
        id: dl-os-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/alpine-dl
            ~/.buildroot-dl
          key: dl-alpine-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            dl-alpine-${{ matrix.board }}-

      - name: Build Components
        run: make -C minime/targets/alpine components BOARD=${{ matrix.board }}

      - name: Build Image for MinUI
        run: |
          MINIME_COMMIT="$(git rev-parse --short HEAD)"
          UI_COMMIT="$(git rev-parse --short HEAD:minime/ui/minui)"
          export MINIME_COMMIT UI_COMMIT
          make -C minime/targets/alpine image update BOARD=${{ matrix.board }} UI=minui

      - name: Build Image for Allium
        run: |
          MINIME_COMMIT="$(git rev-parse --short HEAD)"
          UI_COMMIT="$(git rev-parse --short HEAD:minime/ui/allium)"
          export MINIME_COMMIT UI_COMMIT
          make -C minime/targets/alpine image update BOARD=${{ matrix.board }} UI=allium

      - name: Save CCache
        if: always() && steps.ccache-os-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/alpine-ccache
            ~/.buildroot-ccache
          key: ccache-alpine-${{ matrix.board }}-${{ github.sha }}

      - name: Save DL Cache
        if: always() && steps.dl-os-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/alpine-dl
            ~/.buildroot-dl
          key: dl-alpine-${{ matrix.board }}-${{ github.sha }}

      - name: Upload to Testing Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload testing minime/targets/alpine/out/${{ matrix.board }}/*.img.zst --clobber || true
          gh release upload testing minime/targets/alpine/out/${{ matrix.board }}/*.tar.zst --clobber || true

  build-os-glibc:
    name: Build OS (buildroot / ${{ matrix.board }})
    needs: [build-bootloader, build-ui-glibc]
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: rk3326
            runner: ubuntu-latest
          - board: rk3566
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Bootloader
        uses: actions/download-artifact@v8
        with:
          name: bootloader-out
          path: minime/uboot/out

      - name: Download UI
        uses: actions/download-artifact@v8
        with:
          name: ui-glibc
          path: minime/ui/out

      - name: Restore CCache
        id: ccache-os-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/alpine-ccache
            ~/.buildroot-ccache
          key: ccache-buildroot-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            ccache-buildroot-${{ matrix.board }}-

      - name: Restore DL Cache
        id: dl-os-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/alpine-dl
            ~/.buildroot-dl
          key: dl-buildroot-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            dl-buildroot-${{ matrix.board }}-

      - name: Build Components
        run: make -C minime/targets/buildroot components BOARD=${{ matrix.board }}

      - name: Build Image for MinUI
        run: |
          MINIME_COMMIT="$(git rev-parse --short HEAD)"
          UI_COMMIT="$(git rev-parse --short HEAD:minime/ui/minui)"
          export MINIME_COMMIT UI_COMMIT
          make -C minime/targets/buildroot image update BOARD=${{ matrix.board }} UI=minui

      - name: Build Image for Allium
        run: |
          MINIME_COMMIT="$(git rev-parse --short HEAD)"
          UI_COMMIT="$(git rev-parse --short HEAD:minime/ui/allium)"
          export MINIME_COMMIT UI_COMMIT
          make -C minime/targets/buildroot image update BOARD=${{ matrix.board }} UI=allium

      - name: Save CCache
        if: always() && steps.ccache-os-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/alpine-ccache
            ~/.buildroot-ccache
          key: ccache-buildroot-${{ matrix.board }}-${{ github.sha }}

      - name: Save DL Cache
        if: always() && steps.dl-os-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/alpine-dl
            ~/.buildroot-dl
          key: dl-buildroot-${{ matrix.board }}-${{ github.sha }}

      - name: Upload to Testing Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload testing minime/targets/buildroot/out/${{ matrix.board }}/*.img.zst --clobber || true
          gh release upload testing minime/targets/buildroot/out/${{ matrix.board }}/*.tar.zst --clobber || true

