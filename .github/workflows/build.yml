name: Build Minime

on:
  push:
    branches: [main]
    paths:
      - 'minime/**'
  pull_request:
    paths:
      - 'minime/**'
  workflow_dispatch:
    inputs:
      build_rk3326:
        description: 'Build rk3326 targets'
        type: boolean
        default: false
      build_buildroot_h700:
        description: 'Build Buildroot h700 target'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-bootloader:
    name: Build Bootloader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Bootloader Cache
        id: cache-bootloader-restore
        uses: actions/cache/restore@v6
        with:
          path: minime/uboot/out
          key: bootloader-${{ hashFiles('minime/uboot/config/**', 'minime/uboot/patches/**', 'minime/build/mkbootloader.sh') }}

      - name: Restore Bootloader CCache
        id: ccache-bootloader-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.bootloader-ccache
          key: ccache-bootloader-${{ github.sha }}
          restore-keys: |
            ccache-bootloader-

      - name: Compile Bootloader
        if: steps.cache-bootloader-restore.outputs.cache-hit != 'true' || hashFiles('minime/uboot/out/h700/u-boot-sunxi-with-spl.bin', 'minime/uboot/out/rk3326/idbloader.img', 'minime/uboot/out/rk3566/idbloader.img') == ''
        run: |
          docker run --rm -u root \
            -v "$HOME/.bootloader-ccache:/root/.ccache" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "ghcr.io/${{ github.repository_owner }}/minime-glibc:latest" \
            /bin/bash -c "minime/build/mkbootloader.sh rk3326 2026.07 && minime/build/mkbootloader.sh rk3566 2026.07 && minime/build/mkbootloader.sh h700 2026.07 && chown -R \$(stat -c '%u:%g' /workspace) /workspace/minime/uboot/out"
          sudo chown -R "$USER:$USER" minime/uboot/out

      - name: Save Bootloader Cache
        if: always() && (steps.cache-bootloader-restore.outputs.cache-hit != 'true' || hashFiles('minime/uboot/out/h700/u-boot-sunxi-with-spl.bin', 'minime/uboot/out/rk3326/idbloader.img', 'minime/uboot/out/rk3566/idbloader.img') == '')
        uses: actions/cache/save@v6
        with:
          path: minime/uboot/out
          key: bootloader-${{ hashFiles('minime/uboot/config/**', 'minime/uboot/patches/**', 'minime/build/mkbootloader.sh') }}

      - name: Save Bootloader CCache
        if: always() && steps.ccache-bootloader-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bootloader-ccache
          key: ccache-bootloader-${{ github.sha }}

      - name: Upload Bootloader Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootloader-out
          path: minime/uboot/out

  build-ui:
    name: Build UI (${{ matrix.libc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: musl
            runner: ubuntu-24.04-arm
            container: ghcr.io/${{ github.repository_owner }}/minime-musl:latest
          - libc: glibc
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore UI Cache
        id: cache-ui-restore
        uses: actions/cache/restore@v6
        with:
          path: minime/ui/out
          key: ui-${{ matrix.libc }}-${{ hashFiles('.git/modules/minime/ui/allium/HEAD', '.git/modules/minime/ui/minui/HEAD', 'minime/build/mkui.sh') }}

      - name: Restore UI CCache
        id: ccache-ui-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.ui-ccache-${{ matrix.libc }}
          key: ccache-ui-${{ matrix.libc }}-${{ github.sha }}
          restore-keys: |
            ccache-ui-${{ matrix.libc }}-

      - name: Compile MinUI
        if: steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/minui-{0}-aarch64.tar.xz', matrix.libc)) == ''
        run: |
          minime/build/mkui.sh minui ${{ matrix.libc }}

      - name: Compile Allium
        if: steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.xz', matrix.libc)) == ''
        run: |
          minime/build/mkui.sh allium ${{ matrix.libc }}

      - name: Save UI Cache
        if: always() && (steps.cache-ui-restore.outputs.cache-hit != 'true' || hashFiles(format('minime/ui/out/minui-{0}-aarch64.tar.xz', matrix.libc)) == '' || hashFiles(format('minime/ui/out/allium-{0}-aarch64.tar.xz', matrix.libc)) == '')
        uses: actions/cache/save@v6
        with:
          path: minime/ui/out
          key: ui-${{ matrix.libc }}-${{ hashFiles('.git/modules/minime/ui/allium/HEAD', '.git/modules/minime/ui/minui/HEAD', 'minime/build/mkui.sh') }}

      - name: Save UI CCache
        if: always() && steps.ccache-ui-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ui-ccache-${{ matrix.libc }}
          key: ccache-ui-${{ matrix.libc }}-${{ github.sha }}

      - name: Upload UI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.libc }}
          path: minime/ui/out

  build-os:
    name: Build OS (${{ matrix.os }} / ${{ matrix.board }})
    needs: [build-bootloader, build-ui]
    strategy:
      fail-fast: false
      matrix:
        os: [alpine, buildroot]
        board: [h700, rk3326, rk3566]
        include:
          - os: alpine
            libc: musl
            runner: ubuntu-24.04-arm
          - os: buildroot
            libc: glibc
            runner: ubuntu-latest
        exclude:
          - board: ${{ inputs.build_rk3326 == true && 'never_match' || 'rk3326' }}
            os: alpine
          - board: ${{ inputs.build_rk3326 == true && 'never_match' || 'rk3326' }}
            os: buildroot
          - board: ${{ inputs.build_buildroot_h700 == true && 'never_match' || 'h700' }}
            os: buildroot
    runs-on: ${{ matrix.runner }}
    env:
      # The arm runner's host podman (crun) rejects the arm64 builder image
      # with "crun: unknown version specified", and GitHub's newer runner
      # image blocks JS actions inside Alpine/ARM container jobs. Use the
      # host's docker CLI (runc/containerd) instead of podman; the Makefile's
      # PODMAN_CMD is overridable so this takes effect without code changes.
      PODMAN_CMD: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Bootloader
        uses: actions/download-artifact@v8
        with:
          name: bootloader-out
          path: minime/uboot/out

      - name: Download UI
        uses: actions/download-artifact@v8
        with:
          name: ui-${{ matrix.libc }}
          path: minime/ui/out

      - name: Restore CCache
        id: ccache-os-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/alpine-ccache
            ~/.buildroot-ccache
          key: ccache-${{ matrix.os }}-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.board }}-

      - name: Restore DL Cache
        id: dl-os-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/alpine-dl
            ~/.buildroot-dl
          key: dl-${{ matrix.os }}-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            dl-${{ matrix.os }}-${{ matrix.board }}-

      - name: Build Components
        run: make -C minime/targets/${{ matrix.os }} components BOARD=${{ matrix.board }}

      - name: Build Image for MinUI
        run: make -C minime/targets/${{ matrix.os }} image update BOARD=${{ matrix.board }} UI=minui

      - name: Build Image for Allium
        run: make -C minime/targets/${{ matrix.os }} image update BOARD=${{ matrix.board }} UI=allium

      - name: Save CCache
        if: always() && steps.ccache-os-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/alpine-ccache
            ~/.buildroot-ccache
          key: ccache-${{ matrix.os }}-${{ matrix.board }}-${{ github.sha }}

      - name: Save DL Cache
        if: always() && steps.dl-os-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/alpine-dl
            ~/.buildroot-dl
          key: dl-${{ matrix.os }}-${{ matrix.board }}-${{ github.sha }}

      - name: Upload to Testing Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload testing minime/targets/${{ matrix.os }}/out/${{ matrix.board }}/*.img.xz --clobber || true
          gh release upload testing minime/targets/${{ matrix.os }}/out/${{ matrix.board }}/*.tar.xz --clobber || true
