name: 'Compute Board Matrix'
description: 'Select board targets for matrix build'
inputs:
  build_h700:
    description: 'Build H700'
    required: false
    default: 'false'
  build_rk3326:
    description: 'Build RK3326'
    required: false
    default: 'false'
  build_rk3566:
    description: 'Build RK3566'
    required: false
    default: 'true'
outputs:
  boards:
    description: 'JSON array of boards to build'
    value: ${{ steps.set.outputs.boards }}

runs:
  using: 'composite'
  steps:
    - name: Select boards
      id: set
      shell: bash
      run: |
        boards='["rk3566","h700"]'
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          boards=$(echo '[]' \
            | jq -c \
                --argjson h700   '${{ inputs.build_h700   || false }}' \
                --argjson rk3326 '${{ inputs.build_rk3326 || false }}' \
                --argjson rk3566 '${{ inputs.build_rk3566 || true }}' \
                'if $h700   then . + ["h700"]   else . end |
                 if $rk3326 then . + ["rk3326"] else . end |
                 if $rk3566 then . + ["rk3566"] else . end')
        fi
        echo "boards=${boards}" >> "$GITHUB_OUTPUT"
