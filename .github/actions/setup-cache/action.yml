name: 'Setup & Restore Build Cache'
description: 'Restores and configures dl, ccache, and package caches with post-build save'

inputs:
  target:
    description: 'Target distro (alpine or buildroot)'
    required: true
  board:
    description: 'Target board name (h700, rk3326, rk3566)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Restore & Save dl cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.target == 'alpine' && '~/alpine-dl' || '~/.buildroot-dl' }}
        key: minime-${{ inputs.target }}-dl
        save-always: true

    - name: Restore & Save ccache (Buildroot)
      if: inputs.target == 'buildroot'
      uses: actions/cache@v4
      with:
        path: ~/.buildroot-ccache
        key: minime-buildroot-ccache-${{ inputs.board }}-${{ hashFiles('packages/components/boards/*/tiny-*.config', 'packages/components/buildroot/external/configs/*.config', 'packages/components/buildroot/external/package/**/*.mk', 'packages/components/boards/*/patches/**') }}
        restore-keys: |
          minime-buildroot-ccache-${{ inputs.board }}-
        save-always: true

    - name: Restore & Save package cache (Alpine)
      if: inputs.target == 'alpine'
      uses: actions/cache@v4
      with:
        path: ~/alpine-output/${{ inputs.board }}/packages
        key: minime-alpine-pkgs-${{ inputs.board }}-${{ hashFiles('packages/components/boards/common/tiny-base.config', 'packages/components/boards/common/tiny-panfrost.config', 'packages/components/boards/common/tiny-libmali.config', 'packages/components/boards/common/firmware/**', 'packages/components/boards/common/overlay/**', 'packages/components/boards/${{ inputs.board }}/tiny-*.config', 'packages/components/boards/${{ inputs.board }}/patches/**', 'packages/components/boards/${{ inputs.board }}/dts/**', 'packages/components/boards/${{ inputs.board }}/firmware/**', 'packages/components/alpine/aports/**') }}
        restore-keys: |
          minime-alpine-pkgs-${{ inputs.board }}-
        save-always: true

    - name: Prepare cache directories
      shell: bash
      run: |
        if [ "${{ inputs.target }}" = "alpine" ]; then
          mkdir -p ~/alpine-output/${{ inputs.board }} ~/alpine-output/packages ~/alpine-repos ~/alpine-ccache ~/alpine-dl
        else
          mkdir -p ~/.buildroot-ccache ~/.buildroot-dl
          ccache --max-size=4G || true
        fi
